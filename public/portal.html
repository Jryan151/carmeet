<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Host portal</title>
<meta name="theme-color" content="#17191e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/site.css?v=3">
<style>
  .tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 8px calc(-1 * var(--gutter)) 0; padding: 0 var(--gutter); scrollbar-width: none; }
  .tabs button { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--dim); font: 600 16px "Barlow", sans-serif; padding: 12px 10px; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .card { background: var(--lot); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 12px 0; }
  .card h3 { margin-bottom: 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .stat { background: var(--lot); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .stat b { display: block; font: 700 32px/1 "Barlow Condensed", sans-serif; }
  .stat span { color: var(--dim); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rowx { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .rowx:last-child { border-bottom: 0; }
  .tag { font-size: 13px; color: var(--dim); }
  .tag.in { color: var(--ok); }
  .btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatches button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .swatches button[aria-pressed="true"] { border-color: var(--ink); }
  .copybox { background: var(--lot-2); border: 1px dashed var(--line); border-radius: 8px; padding: 10px; font-size: 14px; word-break: break-word; }
  .checks label { display: flex; align-items: center; gap: 8px; color: var(--ink); margin: 8px 0; }
  .checks input { width: auto; min-height: 0; }
  .kit { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .kit figure { margin: 0; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--lot); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .kit .art { aspect-ratio: 1; display: grid; place-items: center; border-radius: 8px; padding: 8px;
    background: repeating-conic-gradient(#1b1726 0 25%, #231d31 0 50%) 0 0 / 16px 16px; }
  .kit .art img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .kit figcaption { font-size: 14px; overflow-wrap: anywhere; }
  .kit .bar { margin-top: 0; }
  .kit .btn.sm { flex: 1; padding: 0 8px; }
  .flyer-prev { width: 100%; max-width: 320px; border-radius: 10px; border: 1px solid var(--line); margin: 6px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="wrap top"><div><span class="who" id="whoName">Host portal</span><div class="city" id="whoUrl"></div></div></header>
<main class="wrap" id="app">
  <section id="signin">
    <h1 style="font-size:40px;margin-bottom:8px">Your meets, one page</h1>
    <p class="dim">Post your next meet, bring in food trucks, and let people know. Sign in with your email: we send a code, no password.</p>
    <form id="fEmail"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required maxlength="120">
      <p style="margin-top:12px"><button class="btn go" type="submit">Send my code</button></p></form>
    <form id="fCode" hidden><label for="code">6-digit code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
      <div id="newHost" hidden>
        <label for="hName">What’s your meet called?</label><input id="hName" maxlength="60" placeholder="Tasty Tuesday">
        <label for="hSlug">Page address</label><input id="hSlug" maxlength="40" placeholder="tasty-tuesday" autocapitalize="off">
        <p class="small dim" id="slugPreview"></p>
        <label for="hCity">City (optional)</label><input id="hCity" maxlength="60" placeholder="Phoenix">
      </div>
      <p style="margin-top:12px"><button class="btn go" type="submit">Sign in</button> <button class="link" type="button" id="again">Send a new code</button></p></form>
    <div class="msg" id="signMsg" role="status"></div>
  </section>

  <div id="portal" hidden>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="next" aria-selected="true">Next meet</button>
      <button role="tab" data-tab="meets">Meets</button>
      <button role="tab" data-tab="kit">Flyer kit</button>
      <button role="tab" data-tab="updates">Send update</button>
      <button role="tab" data-tab="history">History</button>
      <button role="tab" data-tab="settings">Settings</button>
    </nav>
    <div id="view"></div>
  </div>
</main>
<script src="/static/portal.js?v=3" defer></script>
</body>
</html>
